name: vstep-ldp

services:
  web:
    build: .
    image: ${IMAGE:-ghcr.io/minhtungle/vstep-ldp}:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-15090}:80"
    environment:
      # Thông tin SMTP đọc từ file .env (không commit vào git).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
