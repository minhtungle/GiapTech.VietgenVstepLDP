name: vstep-ldp

services:
  web:
    build: .
    image: ${IMAGE:-ghcr.io/minhtungle/vstep-ldp}:${TAG:-react}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:3101"
    environment:
      PORT: 3101
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
